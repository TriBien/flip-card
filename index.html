<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#08080f" />
    <meta
      name="description"
      content="Flipwise — a mobile-first flip card app with spaced repetition."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Flipwise — Spaced repetition flip cards</title>
    <script>
      try {
        var stored = JSON.parse(
          localStorage.getItem('flipwise.settings.v1') || '{}',
        )
        document.documentElement.dataset.theme =
          stored.theme === 'light' ? 'light' : 'dark'
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
